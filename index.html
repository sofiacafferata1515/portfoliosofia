<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sofia Cafferata — Portfolio</title>

  <link rel="stylesheet" type="text/css" href="style.css">

  <link rel="stylesheet" type="text/css" href="fonts.css">

</head> 




<body>

  <header id="top">
    <span>[Portfolio de Moda]</span>
    <nav><button id="about" data-cur="abrir">[sobre mí]</button><button id="close" data-cur="cerrar">[cerrar]</button></nav>
    <span>[Sofia Cafferata]</span>
</header>

<div id="stage">
  <div id="index"></div>
  <div id="title"></div>
  <div id="scene"><div id="ring"></div></div>
</div>
<footer id="bot"><span id="f1"></span><span id="f2"></span></footer>

<div id="cover" data-cur="bajar"><div>
  <span class="b">Sofia Cafferata</span>
  <span class="t">Portfolio</span>
</div> 
  <small>[ scrolleá ]</small> 
</div>
<div id="open"><div id="wrap">
  <aside id="side">
  </aside><div id="col">
  </div></div></div>

<div id="cur">[  ]</div>








<script src="data.js"></script>

<script>
const $ = (s, r = document) => r.querySelector(s), n = PROJECTS.length, step = 360 / n;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (matchMedia("(hover:hover)").matches) document.documentElement.classList.add("fine");
$("#cover").style.backgroundImage = `url(${HERO})`;

let down = false, dragged = false, lx = 0;
const maxScroll = () => document.documentElement.scrollHeight - innerHeight;

/* tarjetas del anillo + índice */
const ring = $("#ring"), index = $("#index");
index.innerHTML = `<h1>[Proyectos]</h1>`;
const cards = PROJECTS.map((p, i) => {
  const c = document.createElement("button");
  c.className = "card"; c.dataset.cur = "ver";
  c.innerHTML = `<img src="${p.cover}" alt="${p.t1} ${p.t2}"><span>[${i + 1}]</span>`;
  c.onclick = e => { if (!dragged) openView(p, e); };
  ring.appendChild(c);
  const b = document.createElement("button");
  b.dataset.cur = "ir"; b.textContent = `[${i + 1}] ${p.t1} ${p.t2}`;
  b.onclick = () => scrollTo(0, innerHeight + i / (n - 1) * (maxScroll() - innerHeight));
  index.appendChild(b);
  return c;
});
const idxBtns = [...index.querySelectorAll("button")];
let R = 0;
function size() {
  const H = Math.min(innerHeight * .5, innerWidth * .62), W = H * .75;
  R = Math.max(W * 1.25, W * .62 / Math.tan(Math.PI / n));
  cards.forEach((c, i) => {
    c.style.cssText += `width:${W}px;height:${H}px;margin:${-H / 2}px 0 0 ${-W / 2}px;transform:rotateY(${i * step}deg) translateZ(${R}px)`;
  });
}
size(); addEventListener("resize", size);

/* título y pie según el proyecto al frente */
let front = -1;
function setFront(i) {
  front = i; const p = PROJECTS[i], t = $("#title");
  t.innerHTML = `<span class="b">${p.t1}</span> <span class="t">${p.t2}</span>`;
  t.classList.remove("in"); void t.offsetWidth; t.classList.add("in");
  $("#f1").textContent = `[${p.tipo}]`; $("#f2").textContent = `[${p.fecha}]`;
  idxBtns.forEach((b, k) => b.classList.toggle("on", k === i));
}

/* bucle: scroll -> rotación con inercia, cursor, parallax */
let rot = 0, mx = 0, my = 0, cx = 0, cy = 0, tx = 0, ty = 0;
(function frame() {
  const vh = innerHeight, y = scrollY, t = Math.min(1, y / vh);
  const q = Math.min(1, Math.max(0, (y - vh) / Math.max(1, maxScroll() - vh)));
  $("#cover").style.clipPath = `inset(0 0 ${t * 100}% 0)`;
  $("#cover div").style.transform = `translateY(${-t * 25}vh)`;
  $("#cover").style.pointerEvents = t > .95 ? "none" : "auto";
  rot += (-q * (360 - step) - rot) * (reduce ? 1 : .075);
  ring.style.transform = `translateZ(${-R}px) rotateX(${-my * 5}deg) rotateY(${rot + mx * 10}deg)`;
  cards.forEach((c, i) => c.style.opacity = (.3 + .7 * Math.max(0, Math.cos((i * step + rot) * Math.PI / 180))).toFixed(2));
  const f = Math.min(n - 1, Math.max(0, Math.round(-rot / step)));
  if (f !== front) setFront(f);
  cx += (tx - cx) * .22; cy += (ty - cy) * .22;
  $("#cur").style.transform = `translate(${cx + 14}px,${cy + 14}px)`;
  requestAnimationFrame(frame);
})();

addEventListener("pointermove", e => {
  tx = e.clientX; ty = e.clientY; mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5;
  const el = e.target.closest("[data-cur]");
  $("#cur").textContent = `[ ${el ? el.dataset.cur : " "} ]`;
  if (!down) return;
  if (Math.abs(e.clientX - lx) > 6) dragged = true;
  scrollBy(0, -(e.clientX - lx) * 2.4); lx = e.clientX;
});
/* arrastrar la escena para girar */
$("#scene").addEventListener("pointerdown", e => { down = true; dragged = false; lx = e.clientX; });
addEventListener("pointerup", () => down = false);

/* vista de proyecto: se abre como un círculo desde donde tocaste */
let z = 1;
function openView(d, e) {
  $("#open").style.setProperty("--x", (e ? e.clientX : innerWidth / 2) + "px");
  $("#open").style.setProperty("--y", (e ? e.clientY : innerHeight / 2) + "px");
  $("#side").innerHTML = `<p>${d.tipo ? `[${d.tipo}]` : ""} ${d.fecha ? `[${d.fecha}]` : ""}</p>
    <h2><span class="b">${d.t1}</span><br><span class="t">${d.t2}</span></h2>
    ${d.txt.map(x => `<p>${x}</p>`).join("")}${(d.links || []).map(([l, h]) => `<a href="${h}" target="_blank" rel="noopener">${l}</a>`).join("")}`;
  const col = $("#col"), cols = innerWidth < 800 ? 2 : 3, rows = Math.ceil(d.imgs.length / cols);
  col.innerHTML = ""; col.style.height = rows * 46 + 40 + "vh";
  d.imgs.forEach((src, i) => {
    const r = k => Math.abs(Math.sin(i * 97 + k * 31) * 1e4) % 1, im = new Image();
    im.src = src; im.alt = `${d.t1} ${d.t2}`; im.draggable = false; im.dataset.cur = "arrastrar";
    im.style.cssText = `width:${cols === 2 ? 44 : 24}vw;left:${(i % cols) * (100 / cols - 2) + r(1) * 6}%;top:${Math.floor(i / cols) * 46 + r(2) * 8}vh;rotate:${(r(3) - .5) * 6}deg`;
    im.onpointerdown = ev => {
      im.setPointerCapture(ev.pointerId); im.style.zIndex = ++z; im.style.cursor = "grabbing";
      const sx = ev.clientX - im.offsetLeft, sy = ev.clientY - im.offsetTop;
      im.onpointermove = m => { im.style.left = m.clientX - sx + "px"; im.style.top = m.clientY - sy + "px"; };
      im.onpointerup = () => { im.onpointermove = null; im.style.cursor = ""; };
    };
    col.appendChild(im);
  });
  $("#open").scrollTop = 0; document.body.classList.add("lock"); document.documentElement.classList.add("open");
}
const closeView = () => { document.documentElement.classList.remove("open"); document.body.classList.remove("lock"); };
$("#close").onclick = closeView;
addEventListener("keydown", e => e.key === "Escape" && closeView());
$("#about").onclick = e => openView({ ...ABOUT, tipo: "Sobre mí", imgs: [HERO] }, e);
</script>




</body>

</html>
